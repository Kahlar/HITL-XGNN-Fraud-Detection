version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 Relational Database Service
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: hitl-fraud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hitl_fraud_detection}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hitl_fraud_detection}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hitl-network

  # ============================================================================
  # 2. FastAPI Async Backend Service (PyTorch + PyG + GNN Models)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hitl-fraud-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hitl_fraud_detection}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hitl_fraud_detection}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost", "*"]'
    ports:
      - "8000:8000"
    volumes:
      # Read-only mount of precomputed PyG graphs and experiment results
      - ./data/processed:/app/data/processed:ro
      # Read-only mount of trained GNN model checkpoints
      - ./models:/app/models:ro
      # Read-only mount of raw dataset
      - ./data/raw:/app/data/raw:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hitl-network

  # ============================================================================
  # 3. React 18 + TypeScript Nginx Frontend Service
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: hitl-fraud-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hitl-network

volumes:
  postgres_data:
    driver: local

networks:
  hitl-network:
    driver: bridge
